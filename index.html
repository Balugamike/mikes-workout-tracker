<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101312">
  <meta name="description" content="A simple, phone-first pecs and abs workout tracker for Mike.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mike's Workout</title>
  <style>
    :root{color-scheme:dark;--bg:#101312;--panel:#191e1c;--panel2:#202724;--line:#303935;--text:#f3f6f3;--muted:#a4b0a8;--green:#c8f36a;--green2:#96cb36;--orange:#ffb36b;--radius:19px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% -10%,#293320 0,transparent 40%),var(--bg);color:var(--text);min-height:100vh;padding:0 0 calc(36px + env(safe-area-inset-bottom))}
    button,input{font:inherit}button{color:inherit}.app{max-width:700px;margin:0 auto;padding:0 18px}.top{padding:calc(22px + env(safe-area-inset-top)) 0 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.08em;font-size:12px;color:var(--green);text-transform:uppercase}.date{font-size:12px;color:var(--muted);margin-top:6px}.pill{border:1px solid var(--line);border-radius:99px;padding:8px 11px;color:var(--muted);font-size:12px;background:#171b19}
    h1{font-size:clamp(32px,9vw,46px);letter-spacing:-.055em;line-height:1.02;margin:4px 0 10px}h1 span{color:var(--green)}.intro{color:var(--muted);margin:0;line-height:1.5;font-size:14px}.hero{padding:12px 0 23px}.progress-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin:4px 0 24px}.progress-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}.progress-head small{color:var(--muted);font-weight:550}.track{height:7px;background:#343b37;border-radius:10px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:10px;transition:width .25s}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 11px}.section-title h2{font-size:15px;letter-spacing:.01em;margin:0}.section-title span{font-size:11px;color:var(--muted)}.exercise-list{display:grid;gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.card.done{border-color:#627e36}.ex-head{display:flex;gap:12px;align-items:flex-start;padding:15px 15px 12px}.num{width:29px;height:29px;flex:none;border-radius:10px;background:#29312a;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}.ex-title{font-size:15px;font-weight:750;line-height:1.25}.ex-sub{font-size:12px;color:var(--muted);margin-top:4px}.ex-tag{margin-left:auto;border:1px solid var(--line);border-radius:99px;color:#c1cbc3;font-size:10px;padding:5px 8px;white-space:nowrap}.sets{padding:0 12px 12px;display:grid;gap:7px}.set-row{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:7px;align-items:center}.set-label{font-size:11px;color:var(--muted);font-weight:650}.field{height:40px;display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid #343d38;border-radius:11px;padding:0 9px;min-width:0}.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-weight:650;padding:0}.field input::placeholder{color:#748079;font-weight:500}.unit{font-size:10px;color:var(--muted)}.check{height:40px;width:48px;border-radius:11px;border:1px solid #48524b;background:#232a26;font-size:17px;cursor:pointer}.check.checked{background:var(--green);border-color:var(--green);color:#17200e;font-weight:900}.check:active,.action:active{transform:scale(.97)}.card-footer{border-top:1px solid #29312d;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.card-footer button{background:none;border:0;color:var(--green);font-size:11px;font-weight:700;padding:5px;cursor:pointer}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.action{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:750;font-size:13px;cursor:pointer}.action.primary{background:var(--green);border-color:var(--green);color:#18200f}.action:disabled{opacity:.45;cursor:default}.history{margin:24px 0}.history h2{font-size:15px;margin:0 0 11px}.history-empty{color:var(--muted);font-size:13px;background:var(--panel);padding:15px;border-radius:15px;border:1px solid var(--line)}.history-item{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:8px;font-size:13px}.history-item small{color:var(--muted);display:block;margin-top:4px}.history-item strong{color:var(--green)}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#edf8d8;color:#1d2913;border-radius:99px;padding:11px 16px;font-size:13px;font-weight:700;transition:.22s;white-space:nowrap;box-shadow:0 8px 30px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.note{color:#7f8a83;text-align:center;font-size:11px;margin:18px 0 0}
    @media(min-width:600px){.app{padding:0 28px}.sets{padding:0 15px 14px}.ex-head{padding:17px 17px 13px}.set-row{grid-template-columns:60px 1fr 1fr 54px}.check{width:54px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="brand">MIKE / TRAINING LOG</div><div class="date" id="today"></div></div><div class="pill">Pecs + abs</div></header>
  <section class="hero"><h1>Show up.<br><span>Get stronger.</span></h1><p class="intro">Your workout, one set at a time. Your progress saves automatically on this phone.</p></section>
  <section class="progress-wrap" aria-live="polite"><div class="progress-head"><span>Today's progress</span><small id="progressText">0 of 21 sets</small></div><div class="track"><div class="fill" id="progressFill"></div></div></section>
  <section><div class="section-title"><h2>Today's session</h2><span>Tap ✓ when a set is done</span></div><div class="exercise-list" id="exercises"></div></section>
  <div class="actions"><button class="action" id="resetBtn">Reset session</button><button class="action primary" id="finishBtn">Finish workout</button></div>
  <section class="history"><h2>Recent workouts</h2><div id="historyList"></div></section>
  <p class="note">Saved on this device · Keep moving at your own pace</p>
</main><div class="toast" id="toast" role="status"></div>
<script>
const routine=[
 {name:'Incline dumbbell press',sets:4,range:'8–12 reps',type:'strength',tag:'CHEST'},
 {name:'Flat dumbbell bench press',sets:3,range:'8–12 reps',type:'strength',tag:'CHEST'},
 {name:'Dumbbell chest fly',sets:3,range:'10–15 reps',type:'strength',tag:'CHEST'},
 {name:'Push-ups',sets:2,range:'Near failure',type:'bodyweight',tag:'CHEST'},
 {name:'Reverse crunch',sets:3,range:'10–15 reps',type:'bodyweight',tag:'ABS'},
 {name:'Weighted crunch',sets:3,range:'10–15 reps',type:'strength',tag:'ABS'},
 {name:'Forearm plank',sets:3,range:'30–45 sec',type:'time',tag:'ABS'}
];
const STORE='mikes-workout-v1';
const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fresh=()=>({date:dateKey(),sets:routine.map(e=>Array.from({length:e.sets},()=>({done:false,reps:'',weight:''}))),history:[]});
let state;try{state=JSON.parse(localStorage.getItem(STORE))||fresh()}catch{state=fresh()}
if(!state.sets||state.sets.length!==routine.length)state=fresh();
const persist=()=>localStorage.setItem(STORE,JSON.stringify(state));
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());
function render(){const root=document.getElementById('exercises');root.innerHTML='';routine.forEach((ex,ei)=>{const done=state.sets[ei].filter(s=>s.done).length;const card=document.createElement('article');card.className='card'+(done===ex.sets?' done':'');let rows=state.sets[ei].map((s,si)=>{const isTime=ex.type==='time';const leftLabel=isTime?'Time':'Reps';const leftVal=s.reps;const placeholder=isTime?'30–45':ex.range.replace(' reps','');return `<div class="set-row"><span class="set-label">Set ${si+1}</span><label class="field"><input inputmode="decimal" aria-label="${safe(ex.name)} set ${si+1} ${leftLabel.toLowerCase()}" data-field="reps" data-e="${ei}" data-s="${si}" value="${safe(leftVal)}" placeholder="${safe(placeholder)}"><span class="unit">${isTime?'sec':ex.type==='bodyweight'?'reps':''}</span></label>${ex.type==='strength'?`<label class="field"><input inputmode="decimal" aria-label="${safe(ex.name)} set ${si+1} weight in kilograms" data-field="weight" data-e="${ei}" data-s="${si}" value="${safe(s.weight)}" placeholder="kg"><span class="unit">kg</span></label>`:`<span></span>`}<button class="check ${s.done?'checked':''}" aria-label="${s.done?'Uncheck':'Check off'} set ${si+1} of ${safe(ex.name)}" aria-pressed="${s.done}" data-check="${ei}" data-s="${si}">${s.done?'✓':''}</button></div>`}).join('');card.innerHTML=`<div class="ex-head"><div class="num">${String(ei+1).padStart(2,'0')}</div><div><div class="ex-title">${safe(ex.name)}</div><div class="ex-sub">${safe(ex.range)} · ${done}/${ex.sets} done</div></div><span class="ex-tag">${ex.tag}</span></div><div class="sets">${rows}</div><div class="card-footer"><span>${ex.type==='strength'?'Record reps and weight per set':ex.type==='time'?'Record hold time in seconds':'Bodyweight · record reps'}</span><button data-all="${ei}">Mark remaining done</button></div>`;root.append(card)});
root.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',e=>{const i=+e.target.dataset.e,s=+e.target.dataset.s,f=e.target.dataset.field;state.sets[i][s][f]=e.target.value;persist()}));root.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.check,s=+b.dataset.s;state.sets[i][s].done=!state.sets[i][s].done;persist();render()}));root.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.all;state.sets[i].forEach(s=>s.done=true);persist();render()}));
const total=state.sets.flat().length,complete=state.sets.flat().filter(s=>s.done).length;document.getElementById('progressText').textContent=`${complete} of ${total} sets`;document.getElementById('progressFill').style.width=`${Math.round(complete/total*100)}%`;renderHistory();}
function renderHistory(){const el=document.getElementById('historyList');if(!state.history.length){el.innerHTML='<div class="history-empty">Your completed sessions will appear here.</div>';return}el.innerHTML=state.history.slice(0,5).map(h=>`<div class="history-item"><div><b>${safe(new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date(h.date+'T12:00:00')))}</b><small>${h.sets} sets completed</small></div><strong>${h.percent}%</strong></div>`).join('')}
let toastTimer;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('resetBtn').onclick=()=>{if(!state.sets.flat().some(s=>s.done||s.reps||s.weight))return toast('This session is already clear');state.sets=routine.map(e=>Array.from({length:e.sets},()=>({done:false,reps:'',weight:''})));persist();render();toast('Session reset')};
document.getElementById('finishBtn').onclick=()=>{const sets=state.sets.flat(),done=sets.filter(s=>s.done).length;if(!done)return toast('Check off at least one set first');state.history.unshift({date:state.date,sets:done,percent:Math.round(done/sets.length*100)});state.history=state.history.slice(0,20);state.sets=routine.map(e=>Array.from({length:e.sets},()=>({done:false,reps:'',weight:''})));state.date=dateKey();persist();render();toast('Workout saved. Great work!')};
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
